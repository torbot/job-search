<!doctype html>
<html lang="en" data-theme="editorial">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job Search Command Center</title>
<meta name="description" content="A local-first command center for tracking freelance, contract, consulting and full-time opportunities." />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div id="app">

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">JSCC</span>
      <span class="brand-name">Job Search Command Center</span>
    </div>
    <div class="topbar-search">
      <svg class="icon" viewBox="0 0 20 20" fill="none"><path d="M9 16A7 7 0 1 0 9 2a7 7 0 0 0 0 14Zm9 2-4.35-4.35" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="global-search" type="text" placeholder="Search opportunities, companies, contacts, notes…" autocomplete="off" />
      <kbd class="search-kbd">/</kbd>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" data-action="open-quick-add">
        <span class="btn-plus">+</span> Add Opportunity
      </button>
    </div>
  </header>

  <div class="shell">
    <!-- ============ SIDE NAV ============ -->
    <nav class="sidenav" aria-label="Main">
      <button class="nav-item is-active" data-view="dashboard" data-action="nav">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 10.5 10 4l7 6.5M5 9v7h10V9" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="opportunities" data-action="nav">
        <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Opportunities</span>
      </button>
      <button class="nav-item" data-view="companies" data-action="nav">
        <svg viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="8" height="14" stroke="currentColor" stroke-width="1.4"/><path d="M12 8h4v9h-4M6 6h1M6 9h1M6 12h1" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Companies</span>
      </button>
      <button class="nav-item" data-view="contacts" data-action="nav">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M4 17c0-3 3-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Contacts</span>
      </button>
      <button class="nav-item" data-view="tasks" data-action="nav">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 6h12M4 10h12M4 14h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="m4 6 .01 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Tasks</span>
        <span class="nav-badge" id="tasks-nav-badge" hidden>0</span>
      </button>
      <div class="sidenav-spacer"></div>
      <button class="nav-item" data-view="settings" data-action="nav">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.4 4.6l-1.4 1.4M6 12.6l-1.4 1.4M15.4 15.4l-1.4-1.4M6 7.4 4.6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- ============ MAIN ============ -->
    <main class="main" id="main">
      <!-- views are rendered here by app.js -->
    </main>
  </div>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="mobilenav" aria-label="Main mobile">
    <button class="mnav-item is-active" data-view="dashboard" data-action="nav"><span>Dashboard</span></button>
    <button class="mnav-item" data-view="opportunities" data-action="nav"><span>Deals</span></button>
    <button class="mnav-item" data-view="companies" data-action="nav"><span>Companies</span></button>
    <button class="mnav-item" data-view="contacts" data-action="nav"><span>Contacts</span></button>
    <button class="mnav-item" data-view="tasks" data-action="nav"><span>Tasks</span></button>
  </nav>

  <!-- ============ DRAWER (opportunity / company / contact detail) ============ -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-hidden="true">
    <div class="drawer-inner" id="drawer-content"></div>
  </aside>

  <!-- ============ MODAL (quick add, import, task) ============ -->
  <div class="modal-wrap" id="modal-wrap" hidden>
    <div class="modal" id="modal-content" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

</div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
