<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JOBTRAK</title>
<meta name="description" content="An Opportunity Dashboard for tracking freelance, contract, consulting and full-time opportunities." />
<meta name="robots" content="noindex, nofollow" />
<script>
(function () {
  try {
    var t = localStorage.getItem("jobtrak_theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div id="app" class="app">

  <div class="shell">

    <!-- ============ SIDE NAV ============ -->
    <nav class="sidenav" aria-label="Main">
      <div class="sidenav-brand">
        <div class="brand-mark">JOBTRAK</div>
        <p class="brand-name">An Opportunity Dashboard</p>
      </div>
      <div class="sidenav-theme">
        <button type="button" class="theme-toggle" data-action="toggle-theme" role="switch" aria-checked="false" aria-label="Use dark mode">
          <span class="theme-toggle-text">Light</span>
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb">
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.3M8 12.9v1.3M14.2 8h-1.3M3.1 8H1.8M12.4 3.6l-.9.9M4.5 11.5l-.9.9M12.4 12.4l-.9-.9M4.5 4.5l-.9-.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 16 16" fill="none"><path d="M12.6 9.1A5.2 5.2 0 0 1 6.9 3.4 5.3 5.3 0 1 0 12.6 9.1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </span>
          </span>
          <span class="theme-toggle-text">Dark</span>
        </button>
      </div>
      <div class="sidenav-nav">
        <button class="nav-item is-active" data-view="dashboard" data-action="nav">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 10.5 10 4l7 6.5M5 9v7h10V9" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="opportunities" data-action="nav">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Opportunities</span>
        </button>
        <button class="nav-item" data-view="companies" data-action="nav">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="3" width="8" height="14" stroke="currentColor" stroke-width="1.4"/><path d="M12 8h4v9h-4M6 6h1M6 9h1M6 12h1" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Companies</span>
        </button>
        <button class="nav-item" data-view="contacts" data-action="nav">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M4 17c0-3 3-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Contacts</span>
        </button>
        <button class="nav-item" data-view="tasks" data-action="nav">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="m4 6 .01 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Tasks</span>
          <span class="nav-badge" id="tasks-nav-badge" hidden>0</span>
        </button>
      </div>
      <div class="sidenav-footer">
        <button class="nav-item" data-view="settings" data-action="nav">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </nav>

    <!-- ============ MAIN COLUMN ============ -->
    <div class="content-col">
      <header class="content-header">
        <div class="topbar-search">
          <svg class="icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M9 16A7 7 0 1 0 9 2a7 7 0 0 0 0 14Zm9 2-4.35-4.35" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="global-search" type="text" placeholder="Search opportunities, companies, contacts, notes…" autocomplete="off" />
          <kbd class="search-kbd">/</kbd>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" data-action="open-quick-add">
            <span class="btn-plus">+</span> Add Opportunity
          </button>
        </div>
      </header>
      <main class="main" id="main">
        <!-- views are rendered here by app.js -->
      </main>
    </div>

  </div>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="mobilenav" aria-label="Main mobile">
    <button class="mnav-item is-active" data-view="dashboard" data-action="nav"><span>Dashboard</span></button>
    <button class="mnav-item" data-view="opportunities" data-action="nav"><span>Deals</span></button>
    <button class="mnav-item" data-view="companies" data-action="nav"><span>Companies</span></button>
    <button class="mnav-item" data-view="contacts" data-action="nav"><span>Contacts</span></button>
    <button class="mnav-item" data-view="tasks" data-action="nav"><span>Tasks</span></button>
  </nav>

  <!-- ============ DRAWER (opportunity / company / contact detail) ============ -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-hidden="true">
    <div class="drawer-inner" id="drawer-content"></div>
  </aside>

  <!-- ============ MODAL (quick add, import, task) ============ -->
  <div class="modal-wrap" id="modal-wrap" hidden>
    <div class="modal" id="modal-content" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

</div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
